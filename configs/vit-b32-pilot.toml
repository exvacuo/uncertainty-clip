# Three passes over a fixed 8,192-image training subset; full selection pool.
model = "ViT-B-32"
output_dir = "runs/vit-b32-pilot"
seed = 42
epochs = 3
train_limit = 8192
batch_size = 128
eval_batch_size = 128
workers = 4
learning_rate = 0.0005
warmup_steps = 20
device = "cuda"
precision = "amp"
log_every = 10
