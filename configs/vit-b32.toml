# Initial full-data recipe. Tune only against the validation split after the pilot.
model = "ViT-B-32"
data_dir = "data/coco"
manifest = "data/splits/coco2017.json"
output_dir = "runs/vit-b32"
seed = 42
epochs = 5
batch_size = 128
eval_batch_size = 128
workers = 4
learning_rate = 0.0005
weight_decay = 0.2
warmup_steps = 100
grad_clip_norm = 1.0
device = "auto"
precision = "auto"
log_every = 20
